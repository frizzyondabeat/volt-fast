name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  publish:
    runs-on: ubuntu-latest
    needs: security
    permissions:
      id-token: write # Required for OIDC
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Ensure npm CLI supports OIDC Trusted Publishing
        run: npm install -g npm@latest

      - name: Decide whether to publish
        id: gate
        shell: bash
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREVIOUS_VERSION=$(git show "${{ github.event.before }}:package.json" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{console.log(JSON.parse(s).version||'')}catch{console.log('')};});")

          if [ "$CURRENT_VERSION" = "$PREVIOUS_VERSION" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if npm view "$PACKAGE_NAME@$CURRENT_VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.gate.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.gate.outputs.publish == 'true'
        run: pnpm typecheck

      - name: Run tests
        if: steps.gate.outputs.publish == 'true'
        run: pnpm test

      - name: Build package
        if: steps.gate.outputs.publish == 'true'
        run: pnpm build

      - name: Publish to npm
        if: steps.gate.outputs.publish == 'true'
        # OIDC Trusted Publishing — no NODE_AUTH_TOKEN. npm CLI detects it's
        # running in GitHub Actions (via ACTIONS_ID_TOKEN_REQUEST_URL) and
        # exchanges a short-lived OIDC token for a publish grant, as long as
        # this exact repo + workflow filename is registered as a Trusted
        # Publisher on the package's npmjs.com settings. If NODE_AUTH_TOKEN
        # were set here, npm would use classic token auth instead and skip
        # the OIDC exchange entirely.
        run: npm publish --access public --provenance
