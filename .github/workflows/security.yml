name: Reusable security scan

on:
  workflow_call:

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clear stale Grype DB cache
        run: rm -rf ~/.cache/grype

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-${{ github.sha }}.spdx.json

      - name: Scan for vulnerabilities with Grype
        uses: anchore/scan-action@v3
        id: grype
        continue-on-error: true
        env:
          PNPM_HOME: /home/runner/setup-pnpm/node_modules/.bin
          ANCHORE_SBOM_ACTION_PRIOR_ARTIFACT: sbom-${{ github.sha }}.spdx.json
          GRYPE_DB_AUTO_UPDATE: "true"
          GRYPE_DB_MAX_ALLOWED_BUILT_AGE: 336h
        with:
          sbom: sbom.spdx.json
          fail-build: true
          severity-cutoff: high
          output-format: sarif
          update-db: true
          only-fixed: false
          add-cpes-if-none: false
          by-cve: false

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: ./results.sarif

      - name: Fail job if Grype found high-severity vulnerabilities
        if: steps.grype.outcome == 'failure'
        run: |
          echo "Grype scan failed: high-severity vulnerabilities detected."
          exit 1
