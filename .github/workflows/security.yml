name: Reusable security scan

on:
  workflow_call:

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clear stale Grype DB cache
        run: rm -rf ~/.cache/grype

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: |
          syft . -o cyclonedx-json > sbom.json

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan for vulnerabilities with Grype
        id: grype
        continue-on-error: true
        run: |
          grype sbom:sbom.json -o sarif > results.sarif
          grype sbom:sbom.json --fail-on high

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: ./results.sarif

      - name: Fail job if Grype found high-severity vulnerabilities
        if: steps.grype.outcome == 'failure'
        run: |
          echo "Grype scan failed: high-severity vulnerabilities detected."
          exit 1
